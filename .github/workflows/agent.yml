name: Instagram agent

# Bitta ishga tushish 5 soat davomida direktni har 20 soniyada tekshiradi.
# GitHub jadvali kechikib ishlagani uchun (amalda soatiga ~1 marta) navbatdagi ishga tushish
# navbatda kutib turadi va oldingisi tugashi bilan boshlanadi — shunda uzilish bo'lmaydi.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: instagram-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python poll.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OWNER_NAME: Yusuf
          POLL_SECONDS: "20"
          RUN_MINUTES: "300"
          LOOKBACK_MINUTES: "60"
